name: Deploy to Cloudflare

# Two ways to fire this, both usable from a phone:
#   • Push to main (including editing a file in the GitHub web UI)
#   • Actions tab → "Deploy to Cloudflare" → Run workflow
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys race. A queued one supersedes, it doesn't cancel the
# running one — half-applied Durable Object migrations are no fun.
concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Catches config and bundling errors before anything touches production.
      - name: Build (dry run)
        run: npx wrangler deploy --dry-run
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler deploy 2>&1 | tee deploy.log
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1 || true)
          echo "url=${url}" >> "$GITHUB_OUTPUT"
          echo "### Deployed" >> "$GITHUB_STEP_SUMMARY"
          [ -n "$url" ] && echo "$url" >> "$GITHUB_STEP_SUMMARY"

      # Runs after the first deploy, because `wrangler secret put` needs the
      # Worker to already exist. Generates each secret exactly once and never
      # touches it again — rotating TOKEN_ENCRYPTION_KEY would invalidate every
      # stored OAuth token and stop every running job.
      - name: Ensure required secrets exist
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          existing="$(npx wrangler secret list 2>/dev/null || echo '[]')"
          added=0

          ensure () {
            if grep -q "\"$1\"" <<<"$existing"; then
              echo "  • $1 already set"
            else
              echo "  • generating $1"
              eval "$2" | npx wrangler secret put "$1" >/dev/null
              added=1
            fi
          }
          ensure SESSION_SECRET       "openssl rand -hex 32"
          ensure TOKEN_ENCRYPTION_KEY "openssl rand -base64 32"

          if [ "$added" = "1" ]; then
            echo "First-run secrets generated. They live only in Cloudflare — not in this log, not in the repo." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Health check
        run: |
          set -euo pipefail
          url="${{ steps.deploy.outputs.url }}"
          if [ -z "$url" ]; then
            echo "No workers.dev URL found in the deploy output — skipping health check." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # A secret set moments ago takes a few seconds to propagate.
          for i in 1 2 3 4 5 6; do
            body="$(curl -fsS --max-time 15 "$url/api/health" || true)"
            if grep -q '"configured":true' <<<"$body"; then
              echo "Health check passed: $body" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo "Health check did not report configured=true. Last response: ${body:-<none>}" >> "$GITHUB_STEP_SUMMARY"
          exit 1
