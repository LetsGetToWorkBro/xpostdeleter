#:schema node_modules/wrangler/config-schema.json
# The Worker keeps its original name. The product is DELETE.1999, but renaming
# a Worker creates a *new* one: the Durable Objects (Wallet, DeletionJob) and
# their stored jobs stay behind on the old name, and the Workers Builds link
# breaks. Not worth it for a string nobody sees.
name = "xpostdeleter"
main = "src/index.ts"
compatibility_date = "2025-09-01"
workers_dev = true

# ---------------------------------------------------------------------------
# Static SPA. Files in ./public are served straight from Cloudflare's edge.
# Anything that is not a real file falls through to the Worker, and /api/* +
# /auth/* always hit the Worker first.
# ---------------------------------------------------------------------------
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/auth/*"]

# ---------------------------------------------------------------------------
# Sessions + job index. Create with:  npx wrangler kv namespace create SESSIONS
# then paste the returned id below.
# ---------------------------------------------------------------------------
[[kv_namespaces]]
binding = "SESSIONS"
id = "330de6ba50f94f9d9a258e8d44d665fd"
preview_id = "6a0ced124d2647babd20aee281cd1d1f"

# ---------------------------------------------------------------------------
# One Durable Object per deletion job. Holds the queue, the rate-limit window,
# the encrypted tokens and the audit log. Alarms drive the job for hours/days
# even when nobody has the tab open.
# ---------------------------------------------------------------------------
[[durable_objects.bindings]]
name = "DELETION_JOB"
class_name = "DeletionJob"

# Purchased deletion quota, one instance per X account. Separate from the job
# DO on purpose: quota outlives any single job, and money needs its own actor
# so reserve/settle is atomic.
[[durable_objects.bindings]]
name = "WALLET"
class_name = "Wallet"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DeletionJob"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Wallet"]

[vars]
APP_NAME = "DELETE.1999"
# What X charges us per delete, in USD. X publishes no explicit "Post: Delete"
# price — measure it with /api/x/probe and set the real value here. See
# docs/CALIBRATION.md. Every price tier and margin figure derives from this.
X_DELETE_UNIT_COST_USD = "0.01"
# Set this to your deployed origin, e.g. "https://delete.1999loc.com".
# Leave empty to derive the origin from the incoming request (fine for most setups,
# but an explicit value is safer when you sit behind a proxy).
PUBLIC_BASE_URL = ""

# ---------------------------------------------------------------------------
# Secrets (never put these in this file) — set with `wrangler secret put NAME`:
#
#   SESSION_SECRET            required  random 32+ chars, signs session cookies
#   TOKEN_ENCRYPTION_KEY      required  base64 of 32 random bytes, AES-GCM key
#                                       for tokens at rest
#   FACEBOOK_APP_ID           optional  enables the Facebook Pages flow
#   FACEBOOK_APP_SECRET       optional
#   THREADS_APP_ID            optional  enables the Threads flow
#   THREADS_APP_SECRET        optional
#   X_CLIENT_ID               optional  a shared X app; users can instead bring
#   X_CLIENT_SECRET           optional  their own client id/secret in the UI
#   SUPABASE_URL              optional  job history mirror
#   SUPABASE_SERVICE_ROLE_KEY optional
#
#   STRIPE_SECRET_KEY         optional  enables the paid "managed" X mode
#   STRIPE_WEBHOOK_SECRET     optional  whsec_... from the webhook endpoint
#   ADMIN_TOKEN               optional  guards /api/admin/* (appmeter, grants)
#
# Generate the two required ones:
#   openssl rand -base64 32   # TOKEN_ENCRYPTION_KEY
#   openssl rand -hex 32      # SESSION_SECRET
# ---------------------------------------------------------------------------

[observability]
enabled = true

[placement]
mode = "smart"
